<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprit-Taxameter Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        h1 { text-align: center; color: #00e676; margin: 5px 0 15px 0; font-size: 1.6rem; }
        .taxameter-display {
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .price { font-size: 2.8rem; font-weight: bold; color: #00e676; }
        .per-person { font-size: 1.2rem; color: #ffb74d; margin-top: 5px; }
        .details { font-size: 1rem; color: #aaa; margin-top: 8px; }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-top: 8px;
            background: #333;
            color: #fff;
        }
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        label { font-size: 0.85rem; color: #ccc; }
        input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            width: 110px;
            text-align: right;
            font-size: 0.95rem;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-start { background: #00e676; color: #000; }
        .btn-stop { background: #ff5252; color: #fff; }
        .btn-pip { background: #29b6f6; color: #000; }
        .btn-clear { background: #333; color: #ff5252; font-size: 0.8rem; padding: 6px; margin-top: 8px; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .modal-content input[type="text"] {
            width: 90%;
            text-align: center;
            margin: 10px 0 15px 0;
            padding: 10px;
            font-size: 1rem;
        }
        .qrcode-box {
            margin: 15px auto;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-list {
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #ccc;
        }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .history-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .history-title { font-weight: bold; color: #fff; }
        .history-sub { font-size: 0.75rem; color: #888; }
        .history-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 4px;
            margin: 0;
            width: auto;
        }

        #hiddenCanvas, #pipVideo { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>Sprit-Taxameter Pro</h1>
    
    <div class="taxameter-display">
        <div class="price" id="costDisplay">0,00 €</div>
        <div class="per-person" id="perPersonDisplay">Pro Person: 0,00 €</div>
        <div class="details">
            <span id="distanceDisplay">0.00 km</span> | 
            <span id="literDisplay">0.00 L</span> | 
            <span id="speedDisplay">0 km/h</span>
        </div>
        <div class="status-badge" id="modeBadge">Modus: Bereitschaft</div>
    </div>

    <div class="input-group">
        <label for="fuelPrice">Spritpreis (€/L):</label>
        <input type="number" id="fuelPrice" step="0.01" value="1.75" onchange="saveSettings(); updateCalculations();">
    </div>
    <div class="input-group">
        <label for="cityCons">Verbrauch Stadt (L/100km):</label>
        <input type="number" id="cityCons" step="0.1" value="8.0" onchange="saveSettings(); updateCalculations();">
    </div>
    <div class="input-group">
        <label for="highwayCons">Verbrauch Überland (L/100km):</label>
        <input type="number" id="highwayCons" step="0.1" value="5.8" onchange="saveSettings(); updateCalculations();">
    </div>
    <div class="input-group">
        <label for="idleCons">Standgas Verbrauch (L/Std):</label>
        <input type="number" id="idleCons" step="0.1" value="0.8" onchange="saveSettings(); updateCalculations();">
    </div>
    <div class="input-group">
        <label for="passengers">Personen im Auto:</label>
        <input type="number" id="passengers" min="1" value="1" onchange="saveSettings(); updateCalculations();">
    </div>
    <div class="input-group">
        <label for="paypalMe">PayPal.me Name (optional):</label>
        <input type="text" id="paypalMe" placeholder="deinName" onchange="saveSettings();">
    </div>
</div>

<div class="card">
    <button id="toggleBtn" class="btn-start" onclick="toggleTaxameter()">Fahrt Starten</button>
    <button id="pipBtn" class="btn-pip" onclick="togglePip()">Schwebendes Fenster</button>
</div>

<div class="card">
    <div class="history-header">
        <label style="font-weight: bold; color: #00e676;">Fahrtenbuch</label>
        <button class="btn-clear" onclick="clearAllHistory()">Alle löschen</button>
    </div>
    <div class="history-list" id="historyList">
        <div style="text-align: center; color: #666; padding: 10px;">Noch keine Fahrten aufgezeichnet.</div>
    </div>
</div>

<div class="modal" id="summaryModal">
    <div class="modal-content">
        <h2 style="color: #00e676; margin-top: 0;">Fahrt Beendet!</h2>
        <label style="font-size:0.85rem; color:#ccc;">Name für die Fahrt:</label>
        <input type="text" id="tripNameInput" placeholder="z. B. Fahrt nach Hamburg">
        <p id="modalSummaryText"></p>
        <div id="qrcode" class="qrcode-box"></div>
        <button class="btn-start" onclick="saveAndCloseModal()">Fahrt Speichern</button>
    </div>
</div>

<div class="modal" id="qrModal">
    <div class="modal-content">
        <h2 id="qrModalTitle" style="color: #00e676; margin-top: 0; font-size: 1.2rem;"></h2>
        <p id="qrModalText" style="margin-bottom: 5px;"></p>
        <div id="reQrcode" class="qrcode-box"></div>
        <button class="btn-start" onclick="closeQrModal()">Schließen</button>
    </div>
</div>

<canvas id="hiddenCanvas" width="400" height="250"></canvas>
<video id="pipVideo" autoplay playsinline muted></video>

<script>
    let watchId = null;
    let idleInterval = null;
    let totalDistance = 0;
    let totalUsedLiters = 0;
    let lastPosition = null;
    let currentSpeed = 0;
    let speedHistory = [];

    const canvas = document.getElementById('hiddenCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pipVideo');

    loadSettings();
    loadHistory();
    drawCanvas("0,00 €", "0.00 km", "Bereit");

    function toggleTaxameter() {
        const btn = document.getElementById("toggleBtn");
        
        if (watchId === null) {
            if ("geolocation" in navigator) {
                totalDistance = 0;
                totalUsedLiters = 0;
                lastPosition = null;
                currentSpeed = 0;
                speedHistory = [];
                
                watchId = navigator.geolocation.watchPosition(
                    updatePosition, 
                    handleError, 
                    { 
                        enableHighAccuracy: true, 
                        timeout: 10000, 
                        maximumAge: 0 
                    }
                );

                idleInterval = setInterval(checkIdleConsumption, 1000);
                
                btn.innerText = "Fahrt Stoppen & Abrechnen";
                btn.className = "btn-stop";
            } else {
                alert("GPS wird von diesem Browser nicht unterstützt.");
            }
        } else {
            navigator.geolocation.clearWatch(watchId);
            clearInterval(idleInterval);
            watchId = null;
            idleInterval = null;

            btn.innerText = "Neue Fahrt Starten";
            btn.className = "btn-start";
            document.getElementById("modeBadge").innerText = "Modus: Beendet";

            finishTrip();
        }
    }

    function updatePosition(position) {
        const now = position.timestamp || Date.now();

        if (lastPosition) {
            const distKm = calculateDistance(
                lastPosition.coords.latitude, lastPosition.coords.longitude,
                position.coords.latitude, position.coords.longitude
            );
            
            const timeDiffSec = (now - lastPosition.timestamp) / 1000;

            let calculatedSpeed = 0;

            // Priorität 1: Native GPS-Geschwindigkeit
            if (position.coords.speed !== null && !isNaN(position.coords.speed) && position.coords.speed >= 0) {
                calculatedSpeed = position.coords.speed * 3.6;
            } 
            // Priorität 2: Manuelle Berechnung aus Weg & Zeit
            else if (timeDiffSec > 0.2) {
                calculatedSpeed = (distKm / (timeDiffSec / 3600));
            }

            // Filtere GPS-Jitter/Rauschen heraus (< 1.5 km/h ignorieren)
            if (calculatedSpeed < 1.5) calculatedSpeed = 0;

            // Gleitender Mittelwert über die letzten 3 Messungen zur Glättung
            speedHistory.push(calculatedSpeed);
            if (speedHistory.length > 3) speedHistory.shift();
            currentSpeed = speedHistory.reduce((a, b) => a + b, 0) / speedHistory.length;

            // Distanz nur aufsummieren, wenn Bewegung stattgefunden hat (> 2 Meter)
            if (distKm > 0.002) {
                totalDistance += distKm;

                const cityCons = parseFloat(document.getElementById("cityCons").value) || 0;
                const highwayCons = parseFloat(document.getElementById("highwayCons").value) || 0;
                const activeCons = currentSpeed < 40 ? cityCons : highwayCons;

                totalUsedLiters += (distKm * activeCons) / 100;
            }
        }
        
        lastPosition = {
            coords: {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
            },
            timestamp: now
        };

        updateCalculations();
    }

    function checkIdleConsumption() {
        if (currentSpeed < 2 && watchId !== null) {
            const idlePerSec = (parseFloat(document.getElementById("idleCons").value) || 0) / 3600;
            totalUsedLiters += idlePerSec;
            updateCalculations();
        }
    }

    function updateCalculations() {
        const pricePerLiter = parseFloat(document.getElementById("fuelPrice").value) || 0;
        const passengers = parseInt(document.getElementById("passengers").value) || 1;

        const totalCost = totalUsedLiters * pricePerLiter;
        const costPerPerson = totalCost / passengers;

        const costText = totalCost.toFixed(2).replace('.', ',') + " €";
        const perPersonText = "Pro Person: " + costPerPerson.toFixed(2).replace('.', ',') + " €";
        const distText = totalDistance.toFixed(2) + " km";
        const speedText = Math.round(currentSpeed) + " km/h";

        document.getElementById("costDisplay").innerText = costText;
        document.getElementById("perPersonDisplay").innerText = perPersonText;
        document.getElementById("distanceDisplay").innerText = distText;
        document.getElementById("literDisplay").innerText = totalUsedLiters.toFixed(2) + " L";
        document.getElementById("speedDisplay").innerText = speedText;

        let mode = "Standgas (Stau/Ampel)";
        if (currentSpeed >= 2 && currentSpeed < 40) mode = "Stadtverkehr";
        if (currentSpeed >= 40) mode = "Überland / Autobahn";
        if (watchId === null) mode = "Bereitschaft";

        document.getElementById("modeBadge").innerText = "Modus: " + mode;

        drawCanvas(costText, distText, mode);
    }

    function drawCanvas(cost, dist, mode) {
        ctx.fillStyle = "#121212";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#333333";
        ctx.lineWidth = 4;
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

        ctx.fillStyle = "#00e676";
        ctx.font = "bold 48px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(cost, canvas.width / 2, 90);

        ctx.fillStyle = "#ffb74d";
        ctx.font = "22px sans-serif";
        const passengers = parseInt(document.getElementById("passengers").value) || 1;
        const priceNum = parseFloat(cost.replace(',', '.').replace(' €', '')) || 0;
        ctx.fillText("Pro Person: " + (priceNum / passengers).toFixed(2).replace('.', ',') + " €", canvas.width / 2, 130);

        ctx.fillStyle = "#aaaaaa";
        ctx.font = "22px sans-serif";
        ctx.fillText(dist + " | " + Math.round(currentSpeed) + " km/h", canvas.width / 2, 175);

        ctx.fillStyle = "#00b0ff";
        ctx.font = "16px sans-serif";
        ctx.fillText(mode, canvas.width / 2, 215);
    }

    function finishTrip() {
        const pricePerLiter = parseFloat(document.getElementById("fuelPrice").value) || 0;
        const totalCost = totalUsedLiters * pricePerLiter;
        const passengers = parseInt(document.getElementById("passengers").value) || 1;
        const perPerson = (totalCost / passengers).toFixed(2);
        const paypalName = document.getElementById("paypalMe").value.trim();

        document.getElementById("tripNameInput").value = "";

        let summaryHtml = `<strong>Gesamtkosten:</strong> ${totalCost.toFixed(2).replace('.', ',')} €<br>` +
                          `<strong>Strecke:</strong> ${totalDistance.toFixed(2)} km<br>` +
                          `<strong>Pro Person (${passengers}):</strong> ${perPerson.replace('.', ',')} €`;
        
        document.getElementById("modalSummaryText").innerHTML = summaryHtml;

        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";

        if (paypalName !== "" && passengers > 1 && parseFloat(perPerson) > 0) {
            const paypalUrl = `https://paypal.me/${paypalName}/${perPerson}EUR`;
            new QRCode(qrContainer, { text: paypalUrl, width: 128, height: 128 });
        }

        document.getElementById("summaryModal").style.display = "flex";
    }

    function saveAndCloseModal() {
        const pricePerLiter = parseFloat(document.getElementById("fuelPrice").value) || 0;
        const totalCost = totalUsedLiters * pricePerLiter;
        const passengers = parseInt(document.getElementById("passengers").value) || 1;
        const perPerson = (totalCost / passengers).toFixed(2);
        const tripName = document.getElementById("tripNameInput").value.trim() || "Unbenannte Fahrt";

        saveToHistory(tripName, totalDistance.toFixed(2), totalCost.toFixed(2), perPerson, passengers);
        document.getElementById("summaryModal").style.display = "none";
    }

    function showHistoryQr(id) {
        let history = JSON.parse(localStorage.getItem("tripHistory") || "[]");
        const item = history.find(i => i.id === id);
        const paypalName = document.getElementById("paypalMe").value.trim();

        if (!item) return;

        if (!paypalName) {
            alert("Bitte trage zuerst oben deinen PayPal.me Namen ein.");
            return;
        }

        document.getElementById("qrModalTitle").innerText = item.name;
        document.getElementById("qrModalText").innerHTML = `<strong>Pro Person:</strong> ${item.perPerson.replace('.', ',')} €<br><small>(${item.passengers || 1} Personen)</small>`;

        const qrContainer = document.getElementById("reQrcode");
        qrContainer.innerHTML = "";

        const paypalUrl = `https://paypal.me/${paypalName}/${item.perPerson}EUR`;
        new QRCode(qrContainer, { text: paypalUrl, width: 128, height: 128 });

        document.getElementById("qrModal").style.display = "flex";
    }

    function closeQrModal() {
        document.getElementById("qrModal").style.display = "none";
    }

    function saveSettings() {
        const settings = {
            fuelPrice: document.getElementById("fuelPrice").value,
            cityCons: document.getElementById("cityCons").value,
            highwayCons: document.getElementById("highwayCons").value,
            idleCons: document.getElementById("idleCons").value,
            passengers: document.getElementById("passengers").value,
            paypalMe: document.getElementById("paypalMe").value
        };
        localStorage.setItem("taxameterSettings", JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem("taxameterSettings");
        if (saved) {
            const settings = JSON.parse(saved);
            if (settings.fuelPrice) document.getElementById("fuelPrice").value = settings.fuelPrice;
            if (settings.cityCons) document.getElementById("cityCons").value = settings.cityCons;
            if (settings.highwayCons) document.getElementById("highwayCons").value = settings.highwayCons;
            if (settings.idleCons) document.getElementById("idleCons").value = settings.idleCons;
            if (settings.passengers) document.getElementById("passengers").value = settings.passengers;
            if (settings.paypalMe) document.getElementById("paypalMe").value = settings.paypalMe;
        }
    }

    function saveToHistory(name, km, cost, perPerson, passengers) {
        let history = JSON.parse(localStorage.getItem("tripHistory") || "[]");
        const date = new Date().toLocaleDateString("de-DE", { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        
        history.unshift({ id: Date.now(), name, date, km, cost, perPerson, passengers });
        if (history.length > 20) history.pop();
        
        localStorage.setItem("tripHistory", JSON.stringify(history));
        loadHistory();
    }

    function deleteHistoryItem(id) {
        let history = JSON.parse(localStorage.getItem("tripHistory") || "[]");
        history = history.filter(item => item.id !== id);
        localStorage.setItem("tripHistory", JSON.stringify(history));
        loadHistory();
    }

    function clearAllHistory() {
        if (confirm("Möchtest du wirklich alle Fahrten aus dem Fahrtenbuch löschen?")) {
            localStorage.removeItem("tripHistory");
            loadHistory();
        }
    }

    function loadHistory() {
        let history = JSON.parse(localStorage.getItem("tripHistory") || "[]");
        const listEl = document.getElementById("historyList");
        
        if (history.length === 0) {
            listEl.innerHTML = `<div style="text-align: center; color: #666; padding: 10px;">Noch keine Fahrten aufgezeichnet.</div>`;
            return;
        }

        listEl.innerHTML = history.map(item => `
            <div class="history-item">
                <div class="history-info">
                    <span class="history-title">${item.name}</span>
                    <span class="history-sub">${item.date} • ${item.km} km</span>
                </div>
                <div class="history-right">
                    <span style="color:#00e676; font-weight:bold;">${item.cost.replace('.', ',')} €</span>
                    <button class="icon-btn" onclick="showHistoryQr(${item.id})" title="PayPal QR-Code anzeigen">💳</button>
                    <button class="icon-btn" onclick="deleteHistoryItem(${item.id})" title="Löschen" style="color:#ff5252;">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    async function togglePip() {
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                if (!video.srcObject) {
                    const stream = canvas.captureStream(10);
                    video.srcObject = stream;
                    await video.play();
                }
                await video.requestPictureInPicture();
            }
        } catch (err) {
            alert("Schwebendes Fenster fehlgeschlagen: " + err.message);
        }
    }

    function handleError(error) {
        alert("GPS-Fehler: " + error.message + " (Stelle sicher, dass Standortzugriff erlaubt ist)");
    }
</script>

</body>
</html>
